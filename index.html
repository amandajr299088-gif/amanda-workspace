ween;font-weight:700;margin-bottom:12px}.task{background:white;border:1px solid #e3e9f1;border-radius:10px;padding:13px;margin-bottom:10px;box-shadow:0 3px 9px #22334a08}.task strong{display:block;font-size:13px;margin-bottom:8px}.task small{color:#8994a6;display:block;margin-bottom:8px}.task .actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.task button{border:1px solid #e0e7f1;background:white;border-radius:7px;padding:5px 8px;color:#58739c;font-size:11px}.table-wrap{overflow:auto;max-height:57vh}.data{width:100%;border-collapse:collapse;text-align:left}.data th{position:sticky;top:0;background:#f7f9fc;color:#718096;font-weight:600}.data th,.data td{padding:13px;border-bottom:1px solid #eaeef4;white-space:nowrap}.data td:first-child{font-weight:600}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:#68768a;font-weight:600}.field textarea{min-height:90px;resize:vertical}.dialog-back{position:fixed;inset:0;background:#1b283c77;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.dialog-back.show{display:flex}.dialog{width:min(560px,100%);background:white;border-radius:17px;padding:25px;max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0003}.dialog h2{margin:0 0 7px;font-size:20px}.dialog .desc{font-size:12px;color:#8994a5;line-height:1.7;margin-bottom:20px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{line-height:1.85;color:#58677d}.detail b{color:#273b58}.hint{background:#f4f7fc;padding:13px;border-radius:10px;color:#64738a;font-size:12px}.section-caption{color:#8994a5;font-size:12px;margin-bottom:16px}.toggle{display:flex;gap:5px;padding:4px;background:#eef2f8;border-radius:10px}.toggle button{border:0;border-radius:8px;background:transparent;padding:7px 12px;color:#68778e}.toggle button.active{background:#fff;color:#456fa8;box-shadow:0 1px 5px #1f365215}.log{border-left:2px solid #cfdaeb;padding:0 0 18px 14px;margin-left:5px}.log:last-child{padding-bottom:0}.log strong{font-size:13px}.log small{display:block;margin-top:5px;color:#8290a3}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:70px;padding:7px;border:1px solid #e7ecf4;border-radius:8px;font-size:12px;background:#fff}.day .dot{margin-top:4px;color:#567cbb;font-size:10px;display:block}.day.dim{color:#b6bec9;background:#fafbfc}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}.side{width:100%;height:auto;position:static;padding:12px}.brand{padding:5px 8px 10px;font-size:17px}.brand small,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 10px;font-size:12px}.top{position:static;padding:12px;height:auto;align-items:flex-start;flex-direction:column}.page{padding:15px}.cards{gap:8px}.metric{padding:13px}.metric strong{font-size:24px}.project-grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,240px)}.heading h2{font-size:19px}}
 .resource-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.resource-privacy{padding:14px;border-radius:11px;background:#eff6ff;border:1px solid #d3e4fa;color:#385b86;font-size:12px;line-height:1.8;margin-bottom:16px}.resource-card{border:1px solid #e5ebf3;border-radius:11px;padding:16px;margin-bottom:10px;background:white}.resource-card strong{font-size:14px}.resource-card .meta{font-size:12px;color:#748197;margin-top:7px;overflow-wrap:anywhere}.resource-card .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.resource-card .actions button{font-size:12px}.link{color:#487bb6;text-decoration:none}.link:hover{text-decoration:underline}.security-note{font-size:12px;color:#905e37;background:#fff5e7;border-radius:9px;padding:10px;margin:12px 0}.resource-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}@media(max-width:870px){.resource-list{grid-template-columns:1fr}} .scope-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 17px}.scope-label{font-size:12px;font-weight:650;color:#64748b}.scope-bar .toggle{width:max-content;max-width:100%;flex-wrap:wrap}.scope-bar .toggle button{white-space:nowrap}@media(max-width:600px){.scope-bar{align-items:flex-start;flex-direction:column}.scope-bar .toggle{width:100%}.scope-bar .toggle button{flex:1;padding:9px 7px}} </style></head><body><div class="app"><aside class="side"><div class="brand">✦ Amanda Workspace<small>個人＋部門整合｜V0.4.1 雲端連線修正候選版</small></div><nav class="nav" id="nav"></nav><div class="side-bottom">雲端串接候選版<br>預設仍為本機操作<br>手動同步；不改動正式系統</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">工作總覽</h1><div class="sub" id="today"></div></div><div class="top-right"><button class="btn primary" id="addTask">＋ 新增待辦</button></div></header><div class="page" id="content"></div></main></div><div class="dialog-back" id="modal"><div class="dialog" id="modalContent"></div></div>
<script>
'use strict';
const projects=[
{id:'v79',name:'檢驗附件表產生器 V79',version:'V79',area:'個人／跨部門',note:'保留已確認的方案 C 與欄位商業邏輯；正式驗收狀態不得擅自假定。',stage:'尚未正式封版',detail:'已確認方案 C 及上傳區視覺基準；尚有實際功能驗證項目。'},
{id:'erp',name:'台美 ERP 批次寄信工作台',version:'V6.3.4',area:'客服',note:'以 V6.3.4 客服實機測試版為後續唯一修正基準。',stage:'實機測試版',detail:'既有 Outlook Draft、Bridge、模板及附件邏輯應維持；不得直接變更。'},
{id:'receive',name:'收檢即時同步與管理儀表板',version:'依既有版本',area:'客服／收檢',note:'Excel H 欄有效日期代表已收檢；空白代表尚未收檢；異常文字另行處理。',stage:'待確認最新驗收狀態',detail:'保留收檢 Excel 原登記流程；此管理看板不回寫來源欄位。'},
{id:'sales',name:'業務拜訪與商機管理平台',version:'V2.2',area:'業務',note:'第一階段已封版；第二階段尚未正式驗收封版。',stage:'第二階段待驗收',detail:'Dashboard 日期為統計基準日；不新增 Dashboard 狀態篩選。'},
{id:'office',name:'3D 辦公室管理場景',version:'候選版',area:'個人',note:'日系可愛商務風 3D 場景與操作互動持續評估。',stage:'設計候選',detail:'場景與角色品質屬設計評估範圍，不代表已交付正式版本。'}];
const states=['待處理','進行中','待確認','已完成'];
const menu=[['dashboard','◫ 工作總覽'],['tasks','✓ 我的待辦'],['projects','▣ 專案管理'],['board','▤ 看板追蹤'],['collab','♧ 跨部門協作'],['calendar','▦ 行事與時程'],['history','◷ 工作紀錄'],['resources','▧ 工作資訊'],['backup','♧ 備份還原'],['cloud','☁ 雲端同步']];
const key='amanda-workspace-v01-tasks';const safeParse=(s,defaultValue)=>{try{let v=JSON.parse(s);return Array.isArray(v)?v:defaultValue}catch{return defaultValue}};
let tasks=safeParse(localStorage.getItem(key),[]);let history=safeParse(localStorage.getItem(key+'-history'),[]);let resources=safeParse(localStorage.getItem('amanda-workspace-v02-resources'),[]);let resourceSearch='',resourceCategory='all';let page='dashboard',view='all',search='',statusFilter='all',projectFilter='all',calOffset=0;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateString=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};const now=dateString(new Date());
function projectName(id){return projects.find(p=>p.id===id)?.name||'未指定'}
function effectiveView(){return page==='tasks'?'personal':page==='collab'?'department':view}
function scopeTasks(){const current=effectiveView();return tasks.filter(t=>current==='all'||t.scope===current)}
function viewBar(){return `<div class="scope-bar"><span class="scope-label">工作範圍</span><div class="toggle" id="viewToggle"><button data-view="all" class="${view==='all'?'active':''}">全部工作</button><button data-view="personal" class="${view==='personal'?'active':''}">我的工作</button><button data-view="department" class="${view==='department'?'active':''}">部門協作</button></div></div>`}
function scopedProjects(){const current=effectiveView();return projects.filter(p=>current==='all'||(current==='personal'?p.area.includes('個人'):!p.area.startsWith('個人')||p.area.includes('跨部門')))}
function save(){localStorage.setItem(key,JSON.stringify(tasks));localStorage.setItem(key+'-history',JSON.stringify(history))}
function log(message){history.unshift({when:new Date().toLocaleString('zh-TW'),message});history=history.slice(0,200);save()}
function countOpen(){return scopeTasks().filter(t=>t.status!=='已完成')}
function render(){ $('today').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());$('pageTitle').textContent=menu.find(x=>x[0]===page)?.[1].slice(2)||'工作總覽';$('nav').innerHTML=menu.map(([id,label])=>`<button class="${page===id?'active':''}" data-page="${id}">${label}</button>`).join('');let html='';if(page==='dashboard')html=dashboard();if(page==='projects')html=projectsPage();if(page==='tasks')html=tasksPage();if(page==='board')html=boardPage();if(page==='collab')html=collabPage();if(page==='calendar')html=calendarPage();if(page==='history')html=historyPage();if(page==='resources')html=resourcesPage();if(page==='backup')html=backupPage();if(page==='cloud')html=cloudPage();$('content').innerHTML=`<div class="warning">⚑ V0.4.1 候選版：改採 Google 獨立同步管理頁與 JSON 手動交換；本機資料及工作資訊不會自動上傳。</div>`+(['dashboard','projects','board','calendar'].includes(page)?viewBar():'')+html;bindPage();if(page==='resources')bindResources();if(page==='backup')bindBackup();if(page==='cloud')bindCloud()}
function dashboard(){let open=countOpen(),due=open.filter(t=>t.due&&t.due<=now),confirm=open.filter(t=>t.status==='待確認');return `<div class="heading"><div><h2>工作概覽</h2><div class="section-caption">以實際在本候選版建立的待辦計數；沒有建立的任務不會推算。</div></div><span class="pill">${view==='all'?'全部工作':view==='personal'?'我的工作':'部門協作'}</span></div><div class="cards"><div class="metric"><small>已登錄專案</small><strong>${scopedProjects().length}</strong><small>非即時同步數據</small></div><div class="metric"><small>未完成待辦</small><strong>${open.length}</strong><small>本機任務</small></div><div class="metric"><small>待確認</small><strong>${confirm.length}</strong><small>本機任務</small></div><div class="metric"><small>今日到期／逾期</small><strong>${due.length}</strong><small>本機任務</small></div></div><div class="cols"><div><section class="panel"><div class="panel-head"><h3>專案總覽</h3><button class="btn" data-go="projects">查看全部 →</button></div>${scopedProjects().map(p=>`<div class="row-item"><div><strong>${esc(p.name)}</strong><small>${esc(p.version)} · ${esc(p.area)}</small></div><button class="btn" data-project="${p.id}">詳情</button></div>`).join('')||'<div class="empty">此視角暫無專案</div>'}</section></div><div><section class="panel"><div class="panel-head"><h3>最近待辦</h3><button class="btn" data-go="tasks">查看待辦 →</button></div>${open.length?open.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,6).map(t=>taskLine(t)).join(''):'<div class="empty">尚未新增待辦<br>可使用右上角「新增待辦」建立第一筆測試任務。</div>'}</section><section class="panel"><h3>候選設計說明</h3><div class="hint">不將未確認的專案進度轉成虛構百分比；正式進度定義、資料來源、權限與同步方式，待討論後再確認。</div></section></div></div>`}
function taskLine(t){return `<div class="row-item"><div><strong>${esc(t.title)}</strong><small>${esc(projectName(t.project))} · ${esc(t.due||'無截止日')} · ${esc(t.status)}</small></div><button class="btn" data-task="${esc(t.id)}">編輯</button></div>`}
function projectsPage(){return `<div class="heading"><div><h2>專案管理</h2><div class="section-caption">目前納入已知專案，版本與說明為工作脈絡摘要；不代表即時狀態。</div></div></div><div class="project-grid">${scopedProjects().map(p=>`<div class="project"><span class="pill blue">${esc(p.version)}</span><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p><div class="foot"><span class="pill amber">${esc(p.stage)}</span><button class="btn" data-project="${p.id}">查看專案 →</button></div></div>`).join('')||'<div class="empty">目前沒有符合此視角的專案</div>'}</div>`}
function filteredTasks(){return scopeTasks().filter(t=>(statusFilter==='all'||t.status===statusFilter)&&(projectFilter==='all'||t.project===projectFilter)&&(!search||[t.title,t.note,projectName(t.project)].some(x=>x.toLowerCase().includes(search.toLowerCase()))))}
function filters(){return `<div class="filter"><input id="searchInput" placeholder="搜尋任務名稱、備註或專案" value="${esc(search)}" aria-label="搜尋任務"><select id="statusSelect"><option value="all">全部狀態</option>${states.map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select><select id="projectSelect"><option value="all">全部專案</option>${projects.map(p=>`<option value="${p.id}" ${projectFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`}
function tasksPage(){let list=filteredTasks();return `<div class="heading"><div><h2>待辦清單</h2><div class="section-caption">搜尋、篩選與任務操作均可實際測試。</div></div></div><section class="panel">${filters()}<div class="table-wrap"><table class="data"><thead><tr><th>任務名稱</th><th>關聯專案</th><th>檢視範圍</th><th>截止日</th><th>狀態</th><th>操作</th></tr></thead><tbody>${list.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(projectName(t.project))}</td><td>${t.scope==='personal'?'個人':'部門'}</td><td>${esc(t.due||'未設定')}</td><td><span class="pill ${t.status==='已完成'?'green':t.status==='待確認'?'amber':'blue'}">${esc(t.status)}</span></td><td><button class="btn" data-task="${t.id}">查看／編輯</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">無符合條件的待辦</div></td></tr>'}</tbody></table></div></section>`}
function boardPage(){let list=scopeTasks();return `<div class="heading"><div><h2>任務看板</h2><div class="section-caption">暫以四種候選任務狀態示範；可按卡片操作變更，尚不與既有系統狀態對應。</div></div></div><div class="board">${states.map(s=>`<div class="lane"><div class="lane-head"><span>${s}</span><span class="pill">${list.filter(t=>t.status===s).length}</span></div>${list.filter(t=>t.status===s).map(t=>`<div class="task"><strong>${esc(t.title)}</strong><small>${esc(projectName(t.project))}</small><small>${esc(t.due||'未設定期限')}</small><div class="actions"><button data-task="${t.id}">詳細</button>${s!=='已完成'?`<button data-next="${t.id}">下一狀態 →</button>`:''}</div></div>`).join('')||'<div class="empty" style="font-size:12px">尚無任務</div>'}</div>`).join('')}</div>`}
function collabPage(){let collab=tasks.filter(t=>t.scope==='department');return `<div class="heading"><div><h2>跨部門協作</h2><div class="section-caption">只展示於候選版標記為「部門」的任務；不推定責任分工、部門權限或回覆 SLA。</div></div></div><section class="panel"><h3>協作事項</h3>${collab.length?collab.map(taskLine).join(''):'<div class="empty">尚無部門協作任務。新增待辦時，將檢視範圍選為「部門」即可在此追蹤。</div>'}</section><section class="panel"><h3>正式導入前須確認</h3><div class="hint">需要確認任務負責人、協作部門的實際名單與權限、是否需要通知，以及是否僅追蹤進度而不改動原業務系統。</div></section>`}

function bkKeys(v,allowed){return Object.keys(v).every(k=>allowed.includes(k))}
function bkValidate(data){
 if(!bkObject(data)||!bkKeys(data,['format','mode','exportedAt','data'])||data.format!==BK_VERSION||data.mode!=='full-recovery'||!bkObject(data.data))throw Error('不支援的備份格式；僅接受 V0.3.1 完整復原備份。');
 const d=data.data;if(!bkKeys(d,['tasks','history','resources'])||!Array.isArray(d.tasks)||!Array.isArray(d.history)||!Array.isArray(d.resources))throw Error('三組資料結構不完整。');
 if(d.tasks.length>10000||d.history.length>200||d.resources.length>10000)throw Error('資料筆數超出限制。');
 const unique=(arr,label)=>{const ids=arr.map(x=>x.id);if(new Set(ids).size!==ids.length)throw Error(label+'存在重複 ID。')};
 const okTask=t=>bkObject(t)&&bkKeys(t,['id','title','scope','status','project','due','note'])&&bkString(t.id,120)&&t.id.length>0&&bkString(t.title,120)&&t.title.trim().length>0&&['personal','department'].includes(t.scope)&&states.includes(t.status)&&bkString(t.project,100)&&bkString(t.due,10)&&(!t.due||/^\d{4}-\d{2}-\d{2}$/.test(t.due))&&bkString(t.note,3000);
 const okHistory=h=>bkObject(h)&&bkKeys(h,['when','message'])&&bkString(h.when,100)&&bkString(h.message,10000);
 const okResource=r=>bkObject(r)&&bkKeys(r,['id','name','type','reference','location','note'])&&bkString(r.id,120)&&r.id.length>0&&bkString(r.name,100)&&r.name.trim().length>0&&resourceTypes.includes(r.type)&&bkString(r.reference,120)&&bkString(r.location,500)&&bkString(r.note,1000)&&!resourceUnsafe([r.name,r.location,r.reference,r.note])&&(!/^[a-z]+:\/\//i.test(r.location)||validResourceUrl(r.location));
 if(!d.tasks.every(okTask))throw Error('待辦資料有欄位錯誤或格式不符。');if(!d.history.every(okHistory))throw Error('操作紀錄資料格式不符。');if(!d.resources.every(okResource))throw Error('工作資訊包含不合法格式或疑似憑證標籤。');unique(d.tasks,'待辦');unique(d.resources,'工作資訊');
 return d;
}
function bkClear(){backupCandidate=null;const f=$('bkFile');if(f)f.value='';$('bkPreview').textContent='尚未選取備份檔。';$('bkRestore').disabled=true;$('bkCancel').disabled=true}
function bindBackup(){
 $('bkSafe').onclick=bkSafe;$('bkFull').onclick=bkFull;$('bkCancel').onclick=bkClear;
 $('bkFile').onchange=async e=>{backupCandidate=null;$('bkRestore').disabled=true;const file=e.target.files?.[0];if(!file){bkClear();return}if(file.size>BK_MAX_BYTES){$('bkPreview').textContent='檔案超過 3 MB 限制。';return}
 try{const raw=await file.text();const parsed=JSON.parse(raw);const d=bkValidate(parsed);backupCandidate={data:d,name:file.name};$('bkPreview').textContent=`驗證通過：${file.name}。待辦 ${d.tasks.length} 筆（現有 ${tasks.length} 筆）；操作紀錄 ${d.history.length} 筆（現有 ${history.length} 筆）；工作資訊 ${d.resources.length} 筆（現有 ${resources.length} 筆）。此操作將完整覆蓋三組現有資料，不會合併。`; $('bkRestore').disabled=false;$('bkCancel').disabled=false}catch(err){$('bkPreview').textContent='無法匯入：'+err.message;$('bkCancel').disabled=false}}
 $('bkRestore').onclick=()=>{if(!backupCandidate)return;const d=backupCandidate.data;
 if(!confirm('重要：此操作會覆蓋目前全部待辦、操作紀錄與工作資訊。請先保存當前的完整備份。確定繼續？'))return;
 const keys=[key,key+'-history',BK_RESOURCE_KEY],snapshot=keys.map(k=>localStorage.getItem(k));
 try{const values=[d.tasks,d.history,d.resources].map(x=>JSON.stringify(x));keys.forEach((k,i)=>localStorage.setItem(k,values[i]));tasks=d.tasks;history=d.history;resources=d.resources;backupCandidate=null;alert('資料還原完成。已使用原有三個儲存鍵值。');render()}
 catch(err){let rollbackOk=true;keys.forEach((k,i)=>{try{if(snapshot[i]===null)localStorage.removeItem(k);else localStorage.setItem(k,snapshot[i])}catch{rollbackOk=false}});alert(rollbackOk?'還原失敗，已嘗試回復原始資料。請檢查儲存空間。':'還原失敗且自動回復不完整！請勿繼續操作，使用事前備份復原。')}
 };
}

// V0.4.1: top-level GAS sync console; avoids Google nested iframe postMessage.
const CLOUD_URL_KEY='amanda-workspace-v04-cloud-url';
let cloudUrl=localStorage.getItem(CLOUD_URL_KEY)||'';
let cloudStatus='未設定雲端網址';
function cloudValidUrl(url){try{const u=new URL(url);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname)}catch{return false}}
function cloudPage(){return `<div class="heading"><div><h2>雲端同步設定｜V0.4.1</h2><div class="section-caption">GitHub Pages 工作介面＋Google Apps Script 獨立同步管理頁（安全手動交換 JSON）。</div></div></div>
<section class="panel"><h3>① Google Apps Script 同步管理頁</h3><div class="resource-privacy">🔐 不使用原本易逾時的 iframe 橋接。由 Google Apps Script 自己的頂層頁面呼叫 google.script.run，並檢查 Google 帳號白名單。工作資訊及保管庫索引不會放進此同步檔。<br>⚠ 任務名稱、備註及紀錄仍可能含機密，請先檢查內容，不要使用正式機密資料測試。</div>
<div class="field"><label>Apps Script 網頁應用程式 /exec 網址</label><input id="cloudUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(cloudUrl)}"></div>
<div class="filter"><button class="btn primary" id="cloudSave">儲存網址</button><button class="btn" id="cloudOpen">開啟 Google 同步管理頁 ↗</button><button class="btn" id="cloudDisconnect">清除網址</button></div><p id="cloudStatus" class="hint" aria-live="polite">${esc(cloudStatus)}</p></section>
<section class="panel"><h3>② 從本機送往雲端</h3><div class="resource-summary"><span class="pill blue">本機待辦 ${tasks.length} 筆</span><span class="pill">本機工作紀錄 ${history.length} 筆</span><span class="pill amber">尚未自動同步</span></div>
<div class="row-item"><div><strong>匯出雲端交換 JSON</strong><small>只包含 tasks 與 history。下載後在 Google 同步管理頁選取檔案，上傳前仍須確認版本與資料內容。</small></div><button class="btn primary" id="cloudExport">匯出交換 JSON</button></div>
<div class="row-item"><div><strong>從雲端匯回本機</strong><small>先於 Google 同步管理頁下載 JSON，回到這裡選取、驗證及預覽，再覆蓋本機任務與工作紀錄；工作資訊不動。</small></div><input type="file" id="cloudImport" accept=".json,application/json" style="max-width:230px"></div>
<div class="hint" id="cloudPreview" aria-live="polite">尚未選取雲端交換檔案。</div><div class="dialog-actions"><button class="btn primary" id="cloudRestore" disabled>確認還原雲端資料到本機</button></div></section>
<section class="panel"><h3>③ 操作順序與注意</h3><div class="detail">先從「備份還原」頁下載完整本機備份 → 打開 Google 同步管理頁查看雲端版本 → 需要上傳時先匯出本機交換 JSON 再至 Google 頁上傳。若需要下載，從 Google 頁下載交換 JSON，再回此頁預覽還原。這是經人工確認的手動交換，非即時同步、非自動合併。</div></section>`}
function cloudExport(){if(!confirm('此檔未加密，包含任務名稱、備註與工作紀錄。確定內容不含密碼、Token、客戶個資或未核准上雲資料，並僅在受控裝置保存？'))return;const data={format:'amanda-cloud-v04-exchange',revision:null,tasks,history,exportedAt:new Date().toISOString()};const raw=JSON.stringify(data);if(raw.length>45000){alert('資料已超過後端單列容量限制（45000 字元），請先整理測試資料。');return;}bkDownload(data,'Amanda_Workspace_Cloud_Exchange_V041.json')}
let cloudImportCandidate=null;
function cloudValidateImport(v){if(!bkObject(v)||v.format!=='amanda-cloud-v04-exchange'||!Array.isArray(v.tasks)||!Array.isArray(v.history)||!Number.isSafeInteger(v.revision)||v.revision<0)throw Error('請選擇由 Google 同步管理頁下載的有效雲端交換檔案');const d=bkValidate({format:BK_VERSION,mode:'full-recovery',exportedAt:new Date().toISOString(),data:{tasks:v.tasks,history:v.history,resources:[]}});return {revision:v.revision,tasks:d.tasks,history:d.history}}
function bindCloud(){const input=$('cloudUrl');$('cloudSave').onclick=()=>{const value=input.value.trim();if(!cloudValidUrl(value)){cloudStatus='網址格式錯誤，需使用 Google Apps Script /exec HTTPS 網址';$('cloudStatus').textContent=cloudStatus;return;}cloudUrl=value;localStorage.setItem(CLOUD_URL_KEY,value);cloudStatus='網址已儲存。請點「開啟 Google 同步管理頁」。';$('cloudStatus').textContent=cloudStatus};$('cloudOpen').onclick=()=>{const url=input.value.trim();if(!cloudValidUrl(url)){alert('請先填寫有效 /exec 網址並儲存');return;}cloudUrl=url;localStorage.setItem(CLOUD_URL_KEY,url);window.open(url+'?mode=sync','_blank','noopener,noreferrer')};$('cloudDisconnect').onclick=()=>{cloudUrl='';localStorage.removeItem(CLOUD_URL_KEY);input.value='';cloudStatus='已清除網址';$('cloudStatus').textContent=cloudStatus};$('cloudExport').onclick=cloudExport;
$('cloudImport').onchange=async e=>{cloudImportCandidate=null;$('cloudRestore').disabled=true;const file=e.target.files?.[0];if(!file)return;try{if(file.size>3*1024*1024)throw Error('超過 3 MB 限制');const v=cloudValidateImport(JSON.parse(await file.text()));cloudImportCandidate=v;$('cloudPreview').textContent=`驗證成功：雲端版本 ${v.revision}，待辦 ${v.tasks.length} 筆（本機 ${tasks.length} 筆），紀錄 ${v.history.length} 筆（本機 ${history.length} 筆）。確認後將覆蓋本機任務與紀錄，但不修改工作資訊。`;$('cloudRestore').disabled=false}catch(err){$('cloudPreview').textContent='匯入檢查未通過：'+err.message}};
$('cloudRestore').onclick=()=>{if(!cloudImportCandidate)return;if(!confirm('此動作將覆蓋本機待辦及工作紀錄。請先下載完整備份；工作資訊維持原狀。確定還原？'))return;const d=cloudImportCandidate,ot=localStorage.getItem(key),oh=localStorage.getItem(key+'-history');try{localStorage.setItem(key,JSON.stringify(d.tasks));localStorage.setItem(key+'-history',JSON.stringify(d.history));tasks=d.tasks;history=d.history;cloudImportCandidate=null;alert('已還原雲端交換檔，工作資訊未修改。');render()}catch(err){try{if(ot===null)localStorage.removeItem(key);else localStorage.setItem(key,ot);if(oh===null)localStorage.removeItem(key+'-history');else localStorage.setItem(key+'-history',oh)}catch{}alert('還原失敗，請使用事前備份進行復原')}};
}

$('nav').onclick=e=>{let btn=e.target.closest('[data-page]');if(btn){page=btn.dataset.page;render()}};$('content').addEventListener('click',e=>{let btn=e.target.closest('[data-view]');if(btn){view=btn.dataset.view;render()}});$('addTask').onclick=()=>taskModal();$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
